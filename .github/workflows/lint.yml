name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (linting)
        run: ruff check bensemble/ tests/ benchmarks/

      - name: Run ruff format --check (formatting)
        run: ruff format --check bensemble/ tests/ benchmarks/